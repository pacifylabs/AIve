name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_staff_admin
          POSTGRES_PASSWORD: ai_staff_admin_password
          POSTGRES_DB: ai_staff
        ports: ['5460:5432']
        options: >-
          --health-cmd "pg_isready -U ai_staff_admin -d ai_staff"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6390:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the app database role
        run: psql "postgresql://ai_staff_admin:ai_staff_admin_password@localhost:5460/ai_staff" -f infra/postgres/init.sql
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
